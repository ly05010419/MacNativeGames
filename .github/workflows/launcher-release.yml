name: Validate Launcher preview (not notarized)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Launcher version: major.minor.patch'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version
        run: python3 -c 'import os, re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["VERSION"]), "Use major.minor.patch"'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Require local-build regressions
        run: |
          python -m pip install -r games/totk/requirements.txt
          python -m unittest discover -s tests -p 'test_launcher_*.py' -v
      - name: Build portable app and ZIP
        run: >-
          python3 tools/builder_app/make_app.py --portable --version "$VERSION"
          --scratch "$RUNNER_TEMP/launcher-swift"
          -o "$RUNNER_TEMP/download/MNG Launcher.app"
          --zip "$RUNNER_TEMP/download/MNG-Launcher-$VERSION-macOS-arm64.zip"
      - name: Test installed source and bundled Python
        run: |
          APP="$RUNNER_TEMP/download/MNG Launcher.app"
          "$APP/Contents/Resources/python/bin/python3.14" -m unittest discover -s tests -p test_launcher_distribution.py
          "$APP/Contents/Resources/python/bin/python3.14" -B "$APP/Contents/Resources/bundled_job.py" checks > "$RUNNER_TEMP/checks.json"
          python3 -c 'import json, os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/checks.json")); assert d["checks"], d'
          codesign --verify --deep --strict "$APP"
      # Official signing and publication are maintained separately. These
      # ad-hoc builds are only for local testing, never public Release assets.
      - name: Upload maintainer input (not a public download)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        with:
          name: unnotarized-launcher-input-${{ inputs.version }}
          path: ${{ runner.temp }}/download/*.zip*
          if-no-files-found: error
          retention-days: 7
