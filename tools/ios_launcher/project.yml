# The iPhone / iPad MNG Launcher (XcodeGen spec). install.py copies this folder out of the checkout, adds the Mac
# Launcher's shared case views (Shared/), the icon and the player's game pictures (Covers/), and builds it signed with
# your Apple team. It shows the games as the Mac Launcher's Cover Flow and starts the installed ones; it builds nothing.
name: MNGLauncherIOS
options:
  bundleIdPrefix: org.macnativegames
  deploymentTarget:
    iOS: "26.0"
targets:
  MNGLauncher:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared            # tools/builder_app/Sources/MNGBuilder: CoverFlow, CaseDetail, CaseAmounts, CoverArt, ... (install.py SHARED)
      - Assets.xcassets   # made by install.py from tools/builder_app/Resources/AppIcon.png
      - path: Covers      # made by install.py from this Mac's game apps' icons: Covers/<game>.png
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MNG Launcher
        CFBundleName: MNG Launcher
        CFBundleIdentifier: ${MNG_LAUNCHER_BUNDLE_ID}
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIStatusBarHidden: true
        # landscape only (user 2026-11-19: "默认 横版 不要竖版"); an iPad needs full screen for that
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # canOpenURL answers only for the schemes listed here: one per game in Sources/Games.swift
        LSApplicationQueriesSchemes:
          - mng-oot
          - mng-totk
          - mng-botw
          - mng-dkb
          - mng-pkp
          - mng-dread
          - mng-tmnt
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${MNG_LAUNCHER_BUNDLE_ID}
      PRODUCT_NAME: MNGLauncher
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      SWIFT_VERSION: "5.0"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ${MNG_LAUNCHER_TEAM}
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO
